  <noscript><main><h1>Two choices, a shared consequence</h1><p>In the prisoner’s dilemma, each player can cooperate or defect. Mutual cooperation earns 3 points each. If only one defects, that player earns 5 and the other earns 0. Mutual defection earns 1 each. Repeated encounters let strategies respond to earlier actions.</p><p>This site explores when these fixed rules help or hurt. Its conclusions describe a model, not a prescription for human relationships. Enable JavaScript to play the introduction and run experiments. No account is required.</p></main></noscript>
