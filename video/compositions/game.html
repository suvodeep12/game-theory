        const upto = kal ? Math.min(kCounts.length - 1, Math.floor(Math.max(0, keyed(KTURN, t, (p) => p)[0]))) : Math.min(D.apple.counts.length - 1, Math.floor(turnAt(t)));

        document.getElementById('g-tool-storm').classList.toggle('on', tool === 'storm');

        document.getElementById('g-modechip').style.display = tool === 'storm' ? 'none' : 'inline-block';
        document.getElementById('g-modechip').style.background = tool === 'storm' ? 'transparent' : COLORS[tool];
        document.getElementById('g-modechip').style.borderRadius = tool === 1 ? '4px' : '50%';
        document.getElementById('g-mode').firstChild.textContent = tool === 'storm' ? '' : 'Painting:';
        // Designer: opens with the tray growing; the first move flips to C at 23.3.

        document.getElementById('g-lower').style.transform = `translateY(${lowerShift * eo}px)`;

        document.getElementById('g-note-a').style.opacity = flip ? 0 : 1; document.getElementById('g-note-b').style.opacity = flip ? 1 : 0;

        document.getElementById('g-legend-std').style.opacity = kal ? 0 : 1; document.getElementById('g-legend-k').style.opacity = kal ? 1 : 0;
